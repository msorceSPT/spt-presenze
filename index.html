<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1F3D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SPT Presenze"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>SPT Presenze</title></head><body><main class="app"><header><div><h1>SPT Presenze</h1><p>Interventi, assenze e straordinari mensili</p></div><button id="settingsBtn" class="ghost">IMPOSTAZIONI</button></header><div id="installTip" class="notice hidden"></div><section class="monthbar"><button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button></section><section class="card daycard"><div id="dayStatus">Nessuna giornata in corso</div><div class="actions"><button id="startBtn" class="green">ENTRATA</button><button id="stopBtn" class="red">USCITA</button></div></section><section class="stats"><div><small>ORE LAVORATE</small><b id="worked">0:00</b></div><div><small>STRAORDINARIO</small><b id="overtime">0:00</b></div><div><small>ASSENZE</small><b id="absenceHours">0:00</b></div></section><div class="quick"><button id="workBtn" class="blue">+ Lavorazione</button><button id="absenceBtn" class="purple">+ Assenza</button><button id="pdfBtn" class="navy">PDF</button></div><section id="entries"></section></main><dialog id="workDialog"><form method="dialog" id="workForm"><h2>Lavorazione</h2><input type="hidden" id="workId"><label>Data<input type="date" id="workDate" required></label><div class="two"><label>Inizio<input type="time" id="workStart" required></label><label>Fine<input type="time" id="workEnd" required></label></div><label>Cliente / sede<input id="workClient"></label><label>Indirizzo<input id="workAddress"></label><label>Lavorazione eseguita<textarea id="workDescription"></textarea></label><div class="dialogActions"><button type="button" class="ghost" data-close>Annulla</button><button class="blue">Salva</button></div></form></dialog><dialog id="absenceDialog"><form method="dialog" id="absenceForm"><h2>Assenza</h2><input type="hidden" id="absenceId"><label>Tipo<select id="absenceType"><option>Ferie</option><option>Malattia</option><option>Permesso</option></select></label><div class="two"><label>Data<input type="date" id="absenceDate" required></label><label>Fino al (opzionale)<input type="date" id="absenceUntil"></label></div><label id="permessoHoursLabel">Ore permesso<input type="number" id="absenceHoursInput" min="0.5" step="0.5" value="1"></label><div class="dialogActions"><button type="button" class="ghost" data-close>Annulla</button><button class="purple">Salva</button></div></form></dialog><dialog id="settingsDialog"><form method="dialog" id="settingsForm"><h2>Impostazioni</h2><label>Dipendente<input id="employee"></label><label>Azienda<input id="company"></label><label>Sede azienda<input id="companySite"></label><label>Altri dati aziendali<textarea id="companyExtra"></textarea></label><label>Logo<input type="file" id="logoFile" accept="image/*"></label><div class="two"><label>Inizio ordinario<input type="time" id="ordinaryStart" value="08:00"></label><label>Fine ordinario<input type="time" id="ordinaryEnd" value="17:00"></label></div><label class="check"><input type="checkbox" id="weekend" checked> Sabato e domenica: tutte le ore sono straordinario</label><label>Firma dipendente</label><canvas id="signature" width="600" height="160"></canvas><button type="button" class="ghost" id="clearSignature">Cancella firma</button><div class="dialogActions"><button type="button" class="ghost" data-close>Annulla</button><button class="blue">Salva</button></div></form></dialog><script src="lib/jspdf.umd.min.js"></script><script src="logic.js"></script><script src="pdf.js"></script><script src="app.js"></script></body></html>
